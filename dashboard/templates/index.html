<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTFS-RT · Helsinki Live</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: flex;
           height: 100vh; background: #111; color: #e0e0e0; }

    /* Carte principale */
    #map { flex: 1; }

    /* Panneau latéral */
    #panel {
      width: 300px; background: #1a1a2e; display: flex;
      flex-direction: column; overflow: hidden;
    }
    #panel-header {
      padding: 16px; border-bottom: 1px solid #2a2a4a;
    }
    #panel-header h1 { font-size: 15px; font-weight: 600;
                       color: #e0e0ff; letter-spacing: 0.5px; }
    #panel-header p  { font-size: 12px; color: #6060a0; margin-top: 2px; }

    /* Métriques */
    .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr;
               gap: 8px; padding: 12px; }
    .metric { background: #12122a; border-radius: 8px;
              padding: 10px 8px; text-align: center; }
    .metric-val { font-size: 20px; font-weight: 600; color: #a0c4ff; }
    .metric-lbl { font-size: 10px; color: #5050a0; margin-top: 2px;
                  text-transform: uppercase; letter-spacing: 0.5px; }

    /* Liste retards */
    #delays-title { font-size: 11px; color: #5050a0; text-transform: uppercase;
                    letter-spacing: 0.5px; padding: 0 12px 6px; }
    #delays-list  { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .delay-row    { display: flex; align-items: center; justify-content: space-between;
                    padding: 7px 10px; margin-bottom: 4px; border-radius: 6px;
                    background: #12122a; font-size: 12px; }
    .delay-route  { font-weight: 600; color: #c0c0ff; }
    .delay-val    { color: #ff9966; font-weight: 500; }

    /* Statut connexion */
    #status { padding: 8px 12px; font-size: 11px; color: #404060;
              border-top: 1px solid #2a2a4a; display: flex;
              align-items: center; gap: 6px; }
    #status-dot { width: 6px; height: 6px; border-radius: 50%;
                  background: #44ff88; transition: background .3s; }
    #status-dot.off { background: #ff4444; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <h1>GTFS-RT · Helsinki</h1>
    <p>Temps réel · actualisation 15s</p>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-val" id="m-vehicles">—</div>
      <div class="metric-lbl">Véhicules</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-lines">—</div>
      <div class="metric-lbl">Lignes</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-speed">—</div>
      <div class="metric-lbl">km/h moy.</div>
    </div>
  </div>

  <div id="delays-title">Lignes les plus en retard</div>
  <div id="delays-list">Chargement...</div>

  <div id="status">
    <div id="status-dot"></div>
    <span id="status-text">Connexion en cours...</span>
  </div>
</div>

<script>
// ─── Carte Leaflet ────────────────────────────────────────────────────────────

const map = L.map('map', { zoomControl: false }).setView([60.17, 24.94], 12);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  maxZoom: 18,
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ─── Marqueurs dynamiques (flèches orientées) ────────────────────────────────

const markers = {};
let trajectoryLine = null;
let selectedVehicle = null;

function speedColor(kmh) {
  if (kmh < 5)  return '#ff4444';
  if (kmh < 25) return '#ffaa33';
  if (kmh < 50) return '#44aaff';
  return '#44ff88';
}

function arrowIcon(bearing, color) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:0;height:0;
      border-left:6px solid transparent;
      border-right:6px solid transparent;
      border-bottom:12px solid ${color};
      transform:rotate(${bearing}deg);
      filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
    "></div>`,
    iconSize: [12, 12],
    iconAnchor: [6, 8],
  });
}

function onVehicleClick(vehicleId) {
  if (selectedVehicle === vehicleId) {
    map.removeLayer(trajectoryLine);
    trajectoryLine = null;
    selectedVehicle = null;
    return;
  }
  if (trajectoryLine) {
    map.removeLayer(trajectoryLine);
    trajectoryLine = null;
  }
  selectedVehicle = vehicleId;

  fetch(`/api/trajectory/${vehicleId}`)
    .then(r => r.json())
    .then(points => {
      if (!points.length) return;
      const latlngs = points.map(p => [p.latitude, p.longitude]);
      trajectoryLine = L.polyline(latlngs, {
        color: '#ffaa44',
        weight: 3,
        opacity: 0.7,
      }).addTo(map);
      map.fitBounds(trajectoryLine.getBounds().pad(0.05));
    });
}

function updateMarkers(positions) {
  const seen = new Set();

  positions.forEach(v => {
    seen.add(v.vehicle_id);
    const lat = v.latitude;
    const lng = v.longitude;
    const bearing = v.bearing || 0;
    const color = speedColor(v.vitesse_kmh || 0);

    if (markers[v.vehicle_id]) {
      markers[v.vehicle_id].setLatLng([lat, lng]);
      markers[v.vehicle_id].setIcon(arrowIcon(bearing, color));
    } else {
      const marker = L.marker([lat, lng], {
        icon: arrowIcon(bearing, color),
        zIndexOffset: 1000,
      }).addTo(map);

      marker.bindPopup(`
        <b>Ligne ${v.route_id}</b><br>
        Véhicule : ${v.vehicle_id}<br>
        Vitesse : ${v.vitesse_kmh} km/h<br>
        Statut : ${v.current_status}
      `);

      marker.on('click', () => onVehicleClick(v.vehicle_id));
      markers[v.vehicle_id] = marker;
    }
  });

  Object.keys(markers).forEach(id => {
    if (!seen.has(id)) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }
  });
}

// ─── Métriques et retards ─────────────────────────────────────────────────────

function updateStats(stats) {
  document.getElementById('m-vehicles').textContent =
    stats.vehicules_actifs ?? '—';
  document.getElementById('m-lines').textContent =
    stats.lignes_actives ?? '—';
  document.getElementById('m-speed').textContent =
    stats.vitesse_moy_kmh ?? '—';
}

function renderDelays(data) {
  const list = document.getElementById('delays-list');
  if (!data.length) { list.textContent = 'Aucun retard.'; return; }
  list.innerHTML = data.map(d => `
    <div class="delay-row">
      <span class="delay-route">Ligne ${d.route_id}</span>
      <span class="delay-val">+${d.retard_min} min</span>
    </div>
  `).join('');
}

// ─── WebSocket ────────────────────────────────────────────────────────────────

const dot  = document.getElementById('status-dot');
const text = document.getElementById('status-text');

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/dashboard`);

  ws.onopen = () => {
    dot.classList.remove('off');
    text.textContent = 'Connecté · actualisation 15s';
  };

  ws.onmessage = (e) => {
    const payload = JSON.parse(e.data);
    updateMarkers(payload.positions || []);
    updateStats(payload.stats || {});
    renderDelays(payload.delays || []);
  };

  ws.onclose = () => {
    dot.classList.add('off');
    text.textContent = 'Reconnexion dans 5s...';
    setTimeout(connect, 5000);    // reconnexion automatique
  };

  ws.onerror = () => ws.close();
}

// ─── Initial fill (avant WS) ──────────────────────────────────────────────────

(async () => {
  try {
    const [stats, delays] = await Promise.all([
      fetch('/api/stats').then(r => r.json()),
      fetch('/api/delays').then(r => r.json()),
    ]);
    updateStats(stats);
    renderDelays(delays);
  } catch (e) { /* WS prendra le relais */ }
})();

// ─── Init ─────────────────────────────────────────────────────────────────────

connect();
</script>
</body>
</html>
